<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TecnoNews — Contacto</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="page-wrap">
    <div style="text-align:center;max-width:600px;margin:0 auto 48px;">
      <h1 style="margin-bottom:8px;">Contáctanos</h1>
      <p style="color:var(--texto-secundario);">¿Tienes alguna pregunta, sugerencia o quieres colaborar? ¡Escríbenos!</p>
    </div>

    <div class="contact-layout">
      <!-- Información de contacto -->
      <div class="contact-info">
        <div class="contact-info-item">
          <div class="icon-box">✉️</div>
          <div>
            <p class="label">Correo electrónico</p>
            <p class="value">info@tecnonews.com</p>
          </div>
        </div>
        <div class="contact-info-item">
          <div class="icon-box">📞</div>
          <div>
            <p class="label">Teléfono</p>
            <p class="value">+57 300 123 4567</p>
          </div>
        </div>
        <div class="contact-info-item">
          <div class="icon-box">📍</div>
          <div>
            <p class="label">Ubicación</p>
            <p class="value">Bogotá, Colombia</p>
          </div>
        </div>
        <div class="map-box">
          <img src="https://images.unsplash.com/photo-1583444741670-10b8e43f0a37?w=600&h=200&fit=crop&auto=format" alt="Mapa de Bogotá, Colombia">
        </div>
      </div>

      <!-- Formulario -->
      <div class="contact-form-wrap">
        <form class="form-card" id="contactForm" novalidate>
          <div class="form-group">
            <label>Nombre completo <span class="required">*</span></label>
            <input type="text" id="campoNombre" placeholder="Tu nombre">
          </div>
          <div class="form-group">
            <label>Correo electrónico <span class="required">*</span></label>
            <input type="email" id="campoEmail" placeholder="tu@correo.com">
          </div>
          <div class="form-group">
            <label>Teléfono</label>
            <input type="tel" id="campoTelefono" placeholder="+57 300 123 4567">
          </div>
          <div class="form-group">
            <label>Mensaje <span class="required">*</span></label>
            <textarea id="campoMensaje" rows="4" placeholder="Escribe tu mensaje..."></textarea>
          </div>
          <button type="submit" class="btn-submit">Enviar mensaje</button>
        </form>

        <div class="success-box" id="successBox" style="display:none;">
          <div class="success-icon">✓</div>
          <h3>¡Mensaje enviado!</h3>
          <p>Gracias por contactarnos. Nos comunicaremos contigo en las próximas 24 horas.</p>
          <button class="btn-outline" id="btnOtroMensaje" style="margin-top:24px;">Enviar otro mensaje</button>
        </div>
      </div>
    </div>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/contacto.js"></script>
</body>
</html>
