<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TecnoNews — Admin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <span class="logo-badge">TN</span>
        <span>Tecno<span class="accent">News</span></span>
      </a>
      <a href="index.html" style="color:#94a3b8;font-size:0.85rem;">← Volver al sitio</a>
    </div>
  </header>

  <div class="admin-shell">
    <aside class="admin-sidebar">
      <p class="title">Panel de administración</p>
      <nav>
        <button class="admin-nav-item active" data-view="list">📰 Noticias</button>
        <button class="admin-nav-item" data-view="create">➕ Crear noticia</button>
        <button class="admin-nav-item" disabled>👥 Usuarios</button>
        <button class="admin-nav-item" disabled>🚪 Cerrar sesión</button>
      </nav>
    </aside>

    <div class="admin-content">
      <!-- Vista: lista -->
      <div id="vistaLista">
        <div class="admin-header">
          <div>
            <h2>Noticias</h2>
            <p id="totalArticulos">Cargando…</p>
          </div>
          <button class="btn-nueva" id="btnNuevaNoticia">+ Nueva noticia</button>
        </div>
        <div class="admin-table-card">
          <div style="overflow-x:auto;">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Título</th>
                  <th>Categoría</th>
                  <th>Autor</th>
                  <th>Fecha</th>
                  <th style="text-align:right;">Acciones</th>
                </tr>
              </thead>
              <tbody id="tablaBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Vista: crear/editar -->
      <div id="vistaForm" style="display:none;">
        <div class="admin-form-wrap">
          <div class="admin-form-top">
            <button class="btn-back-icon" id="btnVolverLista">←</button>
            <div>
              <h2 id="formTitulo" style="margin:0;font-size:1.2rem;">Crear noticia</h2>
              <p id="formSubtitulo" style="margin:2px 0 0;font-size:0.85rem;color:var(--texto-secundario);"></p>
            </div>
          </div>

          <form id="formAdmin" class="form-card">
            <div class="form-group">
              <label>Título <span class="required">*</span></label>
              <input type="text" id="campoTitulo" placeholder="Ingresa el título de la noticia" required>
            </div>

            <div class="form-group">
              <label>Categoría <span class="required">*</span></label>
              <select id="campoCategoria"></select>
            </div>

            <div class="form-group">
              <label>Descripción breve <span class="required">*</span></label>
              <textarea id="campoExcerpt" rows="2" placeholder="Escribe una breve descripción..." required></textarea>
            </div>

            <div class="form-group">
              <label>Descripción completa <span class="required">*</span></label>
              <textarea id="campoContent" rows="5" placeholder="Escribe el contenido de la noticia..." required></textarea>
            </div>

            <div class="form-group">
              <label>Autor</label>
              <input type="text" id="campoAutor" placeholder="Nombre del autor">
            </div>

            <div class="form-group">
              <label>URL de imagen <span class="required">*</span></label>
              <input type="url" id="campoImagen" placeholder="https://..." required>
              <div class="img-preview" id="imgPreview" style="display:none;"></div>
            </div>

            <div class="form-actions-row">
              <button type="button" class="btn-cancelar" id="btnCancelarForm">Cancelar</button>
              <button type="submit" class="btn-guardar" id="btnGuardar">💾 Guardar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal confirmar eliminación -->
  <div class="modal-overlay" id="modalEliminar">
    <div class="modal-box">
      <div class="modal-icon">🗑</div>
      <h3>¿Eliminar noticia?</h3>
      <p>Esta acción no se puede deshacer. La noticia será eliminada permanentemente.</p>
      <div class="modal-actions">
        <button class="btn-cancelar" id="btnCancelarModal">Cancelar</button>
        <button class="btn-eliminar" id="btnConfirmarEliminar">Eliminar</button>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
