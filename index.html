<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TecnoNews — Inicio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main>
    <!-- Hero -->
    <section class="hero">
      <div class="hero-bg">
        <img src="https://images.unsplash.com/photo-1677442135703-1787eea5ce01?w=1400&h=600&fit=crop&auto=format" alt="Fondo tecnológico">
      </div>
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <div class="inner">
          <span class="hero-pill"><span class="dot-pulse"></span> Noticias en tiempo real</span>
          <h1>La tecnología también <span class="accent">se vive</span> en las noticias</h1>
          <p class="lead">Explora las últimas novedades en tecnología, educación, turismo y mucho más.</p>
          <form class="search-form" id="heroSearchForm">
            <input type="text" id="heroSearchInput" placeholder="Buscar noticias...">
            <button type="submit">🔍</button>
          </form>
        </div>
      </div>
    </section>

    <!-- Categorías -->
    <section class="category-strip">
      <div class="container" id="categoryChips"></div>
    </section>

    <!-- Destacadas -->
    <section class="section">
      <div class="section-header">
        <div>
          <h2>Noticias destacadas</h2>
          <p>Las historias más importantes del día</p>
        </div>
        <a href="noticias.html" class="link-teal">Ver todas →</a>
      </div>
      <div class="news-grid" id="destacadasGrid"></div>
    </section>

    <!-- Más noticias -->
    <section class="section" style="padding-top:0;">
      <div class="section-header">
        <h2>Más noticias</h2>
        <a href="noticias.html" class="link-teal">Ver todas →</a>
      </div>
      <div class="news-grid" id="masNoticiasGrid"></div>
    </section>

    <!-- Showcase por categoría -->
    <section class="showcase">
      <h2>Explora por categoría</h2>
      <div class="showcase-grid" id="showcaseGrid"></div>
    </section>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
